$activeBorderColor = rgb(4a86a8)
$inactiveBorderColor = rgba(3d506455)
$activeShadowColor = rgba(6fa8c966)
$inactiveShadowColor = rgba(10192b2a)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 6
    gaps_out = 12
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 6

    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = $activeShadowColor
        color_inactive = $inactiveShadowColor
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        special = true
        brightness = 0.65
        contrast = 0.8
    }
}

animations {
    animation = workspaces, 1, 4, easeOutQuint, slide
}

layerrule {
    name = waybar_blur
    match:namespace = ^(waybar)$
    blur = true
}

layerrule {
    name = walker_blur
    match:namespace = ^(walker)$
    blur = true
}
